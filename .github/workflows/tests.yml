# Corre los tests automáticos en cada push y en cada pull request.
# Usa una base PostgreSQL temporal que GitHub levanta solo: no hace falta
# configurar ningún secreto.
name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tomo
          POSTGRES_PASSWORD: tomo
          POSTGRES_DB: tomo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tomo -d tomo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - run: pip install -r requirements-dev.txt

      - run: python -m pytest
        env:
          TOMO_TEST_DATABASE_URL: postgresql://tomo:tomo@localhost:5432/tomo_test
