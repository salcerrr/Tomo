# Actualiza el catálogo de Ivrea una vez por semana, aunque la app esté
# dormida (en el plan gratis de Render se apaga sola tras 15 minutos sin uso,
# y la actualización automática interna solo corre mientras está despierta).
#
# Hace falta crear en GitHub (Settings > Secrets and variables > Actions) el
# secreto DATABASE_URL con la misma dirección de base que usa la app.
# Si ya hay una actualización en curso, no arranca otra (candado en la base).
name: Actualizar catálogo

on:
  schedule:
    - cron: "17 6 * * 1"   # lunes 06:17 UTC
  workflow_dispatch:        # también se puede lanzar a mano

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m tomo.jobs refresh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}